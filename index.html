i in range(5, 0, -1):\n    print(f\"Countdown: {i}\")\n    time.sleep(1)\nprint(\"Done!\")"}, {"title": "lab5_5.py", "code": "import datetime\n\ndef greet():\n    hour = datetime.datetime.now().hour\n    if hour < 12:\n        print(\"Good morning!\")\n    elif hour < 18:\n        print(\"Good afternoon!\")\n    else:\n        print(\"Good evening!\")\n\ngreet()"}]}, {"number": 6, "blocks": [{"title": "lab6_led.py", "code": "from gpiozero import LED\nfrom time import sleep\n\nled = LED(17)\n\nwhile True:\n    led.on()\n    sleep(1)\n    led.off()\n    sleep(1)"}, {"title": "lab6_button.py", "code": "from gpiozero import LED, Button\nfrom time import sleep\n\nled = LED(17)\nbutton = Button(27, pull_up=True)  # Important for Grove button\n\nwhile True:\n    if button.is_pressed:\n        led.on()\n    else:\n        led.off()"}, {"title": "lab6_challenge.py", "code": "from gpiozero import LED, Button\nfrom time import sleep\n\nled = LED(17)\nbutton = Button(27, pull_up=True)\n\nwhile True:\n    if button.is_pressed:\n        for i in range(3):\n            led.on()\n            sleep(1)\n            led.off()\n            sleep(1)"}, {"title": "lab6_homework.py", "code": "from gpiozero import LED, Button\nfrom time import sleep\n\nled = LED(17)\nbutton = Button(27, pull_up=True)\n\nled_state = False  # Track LED status\n\nwhile True:\n    button.wait_for_press()  # Wait until button is pressed\n    led_state = not led_state  # Flip the state\n    if led_state:\n        led.on()\n    else:\n        led.off()\n    sleep(0.2)  # Small debounce delay to prevent double toggles"}]}, {"number": 7, "blocks": [{"title": "Instructions / Setup", "code": "#1\ngit clone https://github.com/the-raspberry-pi-guy/lcd\ncd lcd\nsudo sh install.sh \n\n#2\ncd lcd/\npython demo_lcd.py"}, {"title": "lab7_lcd_hello.py", "code": "import drivers\n\ndisplay = drivers.Lcd()\n\nprint(\"Writing to display\")\ndisplay.lcd_display_string(\"This is my new\", 1)\ndisplay.lcd_display_string(\"LCD Program!\", 2)"}, {"title": "lab7_lcd_ipaddress.py", "code": "import drivers\n\nimport time\nfrom subprocess import *\nfrom datetime import datetime\n\ndisplay = drivers.Lcd()\n\ntry:\n    cmd = \"ip addr show wlan0 | grep -m 1 'inet' | awk '{print $2}' | cut -d/ -f1\"\n\n    def run_cmd(cmd):\n        p = Popen(cmd, shell=True, stdout=PIPE)\n        output = p.communicate()[0]\n        return output.decode()\n    \n    while True:\n        print(\"Writing to display\")\n        ipaddr = run_cmd(cmd).strip()\n        print(ipaddr)\n        display.lcd_display_string(datetime.now().strftime('%b %d  %H:%M:%S'), 1) \n        # Add spaces to fully overwrite old characters\n        display.lcd_display_string('{:<16}'.format(ipaddr),2)\n        time.sleep(1) \n\nexcept KeyboardInterrupt: \n    print(\"Cleaning up!\")\n    display.lcd_clear()"}, {"title": "lab7_lcd_ipaddress_cpu.py", "code": "import drivers\nimport time\nfrom subprocess import *\n\ndisplay = drivers.Lcd()\n\ntry:\n    # Command to get IP address\n    cmd_ip = \"ip addr show wlan0 | grep -m 1 'inet' | awk '{print $2}' | cut -d/ -f1\"\n\n    # Command to get CPU temperature\n    cmd_temp = \"vcgencmd measure_temp | egrep -o '[0-9]*\\\\.[0-9]*'\"\n\n    def run_cmd(cmd):\n        p = Popen(cmd, shell=True, stdout=PIPE)\n        output = p.communicate()[0]\n        return output.decode().strip()\n\n    while True:\n\n        print(\"Writing to display\")\n\n        # Read IP address\n        ipaddr = run_cmd(cmd_ip)\n\n        # Read CPU temperature\n        cpu_temp = run_cmd(cmd_temp)\n\n        print(\"IP Address:\", ipaddr)\n        print(\"CPU Temp:\", cpu_temp)\n\n        # Line 1 -> CPU Temperature\n        degree = chr(223)\n        display.lcd_display_string(\"CPU Temp: {}{}C\".format(cpu_temp,degree),1)\n        # Line 2 -> IP Address\n        display.lcd_display_string(\"{}\".format(ipaddr),2)\n\n        time.sleep(1)\n\nexcept KeyboardInterrupt:\n    print(\"Cleaning up!\")\n    display.lcd_clear()"}]}, {"number": 8, "blocks": [{"title": "Instructions / Setup", "code": "sudo crontab -e\n\n#### pi is your Pi username #######\n@reboot python /home/pi/lcd/lab7_lcd_ipaddress.py &\n\nsudo reboot"}]}, {"number": 9, "blocks": [{"title": "Instructions / Setup", "code": "sudo apt update\nsudo apt install -y python3 python3-venv\npython3 -m venv env --system-site-packages\n\nsource env/bin/activate\n# dont need to deactivate, env is required (deactivate for demo purpose only)\ndeactivate\t\n\nsudo apt install python3 python3-pip python3-venv\n\npip3 install adafruit-circuitpython-dht\n\nsudo nano lab9_dht11.py"}, {"title": "lab9_dht11.py", "code": "import time\nimport adafruit_dht\nimport board\n\ndht_device = adafruit_dht.DHT11(board.D21, use_pulseio=False)\n\nwhile True:\n    try:\n        temp_c = dht_device.temperature\n        temp_f = temp_c * (9 / 5) + 32\n\n        humidity = dht_device.humidity\n\n        print(\"Temp:{:.1f} \\u00B0C / {:.1f}\\u00B0F    Humidity: {}%\".format(temp_c, temp_f, humidity))\n    except RuntimeError as err:\n        print(err.args[0])\n\n    time.sleep(2.0)"}, {"title": "lab9_dht11_gpio.py", "code": "import time\nimport adafruit_dht\nimport board\nfrom gpiozero import LED\n\n# Setup DHT11 on GPIO 22\ndht_device = adafruit_dht.DHT11(board.D21, use_pulseio=False)\n\n# Setup LED on GPIO 17\nled = LED(17)\n\nwhile True:\n    try:\n        temp_c = dht_device.temperature\n        temp_f = temp_c * (9 / 5) + 32\n        humidity = dht_device.humidity\n\n        print(f\"Temp: {temp_c:.1f} \\u00B0C / {temp_f:.1f} \\u00B0F    Humidity: {humidity}%\")\n\n        if temp_c is not None and temp_c > 30:\n            print(\"Warning: Hot!\")\n            led.blink(on_time=0.5, off_time=0.5)  # Blink LED\n        else:\n            led.off()  # Turn LED off if below threshold\n\n    except RuntimeError as err:\n        print(err.args[0])\n        led.off()\n\n    time.sleep(2.0)"}]}, {"number": 10, "blocks": [{"title": "lab10.py", "code": "import time\nfrom queue import Empty, SimpleQueue\n\nimport adafruit_dht\nimport board\nfrom gpiozero import LED, Button\n\n\n# Configuration\nALERT_THRESHOLD_C = 30.0\nCLEAR_THRESHOLD_C = 28.0\nREAD_INTERVAL_SECONDS = 2.0\n\nNORMAL = \"NORMAL\"\nALERT = \"ALERT\"\nACKNOWLEDGED = \"ACKNOWLEDGED\"\n\n\n# Hardware setup\ndht_device = adafruit_dht.DHT11(\n    board.D21,\n    use_pulseio=False\n)\n\nled = LED(17)\n\n# Assumes the button connects GPIO27 to GND when pressed.\nbutton = Button(\n    27,\n    pull_up=True,\n    bounce_time=0.1\n)\n\nbutton_events = SimpleQueue()\nstate = NORMAL\n\n\ndef request_acknowledgement():\n    \"\"\"Pass the button event to the main loop.\"\"\"\n    button_events.put(\"ACKNOWLEDGE\")\n\n\ndef process_button_events():\n    \"\"\"Handle button presses in the main loop.\"\"\"\n    global state\n\n    while True:\n        try:\n            button_events.get_nowait()\n        except Empty:\n            break\n\n        if state == ALERT:\n            state = ACKNOWLEDGED\n\n            # Stops blinking and leaves the warning visible.\n            led.on()\n\n            print()\n            print(\"===================================\")\n            print(\"ALERT ACKNOWLEDGED\")\n            print(\"Temperature has not yet recovered.\")\n            print(\"LED remains ON until temperature\")\n            print(f\"falls to {CLEAR_THRESHOLD_C:.0f} °C or below.\")\n            print(\"===================================\")\n\n\ndef update_alert_state(temp_c):\n    \"\"\"Update the alarm using the latest valid temperature.\"\"\"\n    global state\n\n    if state == NORMAL:\n        if temp_c > ALERT_THRESHOLD_C:\n            state = ALERT\n\n            # Start blinking once when entering the alarm state.\n            led.blink(\n                on_time=0.5,\n                off_time=0.5,\n                background=True\n            )\n\n            print()\n            print(\"WARNING!\")\n            print(\n                f\"Temperature exceeded \"\n                f\"{ALERT_THRESHOLD_C:.0f} °C.\"\n            )\n            print(\"Press the button to acknowledge.\")\n\n    elif temp_c <= CLEAR_THRESHOLD_C:\n        # Both ALERT and ACKNOWLEDGED clear automatically.\n        state = NORMAL\n        led.off()\n\n        print()\n        print(\"Temperature back to normal.\")\n        print(\"Alarm cleared. LED OFF.\")\n\n\nbutton.when_pressed = request_acknowledgement\n\nprint(\"Starting Room Monitor...\")\nprint(f\"Alarm triggers above {ALERT_THRESHOLD_C:.0f} °C.\")\nprint(f\"Alarm clears at {CLEAR_THRESHOLD_C:.0f} °C or below.\")\n\nnext_read_time = time.monotonic()\n\ntry:\n    while True:\n        # Check the button frequently for a responsive interface.\n        process_button_events()\n\n        current_time = time.monotonic()\n\n        if current_time >= next_read_time:\n            try:\n                temp_c = dht_device.temperature\n                humidity = dht_device.humidity\n\n                if temp_c is not None:\n                    temp_f = temp_c * (9 / 5) + 32\n\n                    humidity_text = (\n                        f\"{humidity}%\"\n                        if humidity is not None\n                        else \"unavailable\"\n                    )\n\n                    print(\n                        f\"Temp: {temp_c:.1f} °C / \"\n                        f\"{temp_f:.1f} °F, \"\n                        f\"Humidity: {humidity_text}\"\n                    )\n\n                    update_alert_state(temp_c)\n                else:\n                    print(\n                        \"Temperature unavailable. \"\n                        \"Keeping the previous alarm state.\"\n                    )\n\n            except RuntimeError as error:\n                # DHT read errors can occur; retry next interval.\n                print(\"Sensor read error:\", error)\n                print(\"Keeping the previous alarm state.\")\n\n            next_read_time = (\n                time.monotonic() + READ_INTERVAL_SECONDS\n            )\n\n        time.sleep(0.05)\n\nexcept KeyboardInterrupt:\n    print()\n    print(\"Program stopped by user.\")\n\nfinally:\n    print(\"Cleaning up hardware...\")\n\n    button.when_pressed = None\n    button.close()\n\n    led.off()\n    led.close()\n\n    dht_device.exit()\n\n    print(\"Hardware cleanup completed.\")"}]}, {"number": 11, "blocks": [{"title": "lab11.py", "code": "from gpiozero import DistanceSensor, LED\nfrom time import sleep\n\n# Setup sensor and LED\nsensor = DistanceSensor(echo=24, trigger=23)\nled = LED(17)\n\nwhile True:\n    dist = sensor.distance * 100  # convert to cm\n    print(f\"Distance: {dist:.1f} cm\")\n    \n    if dist < 10:   # Object closer than 10 cm\n        led.on()\n    else:\n        led.off()\n    \n    sleep(1)"}]}, {"number": 12, "blocks": [{"title": "lab12.py", "code": "from gpiozero import LED, DigitalInputDevice\nfrom time import sleep\n\n# Setup Grove Light Sensor and LED\nlight_sensor = DigitalInputDevice(18)  # D pin of Grove Light Sensor to GPIO18\nled = LED(17)\n\nwhile True:\n    if light_sensor.value == 0:  # LOW = dark\n        print(\"It's dark! LED ON.\")\n        led.on()\n    else:\n        print(\"It's bright! LED OFF.\")\n        led.off()\n    \n    sleep(1)"}]}, {"number": 13, "blocks": [{"title": "lab13.py", "code": "from gpiozero import OutputDevice, Button\nfrom time import sleep\n\n# Setup relay and button\nrelay = OutputDevice(26)   # Relay control pin\nbutton = Button(27)        # Push button on GPIO27\n\nwhile True:\n    if button.is_pressed:\n        relay.on()\n        print(\"Relay ON - Load powered\")\n    else:\n        relay.off()\n        print(\"Relay OFF - Load disconnected\")\n    \n    sleep(0.2)  # small delay for debounce"}]}, {"number": 14, "blocks": [{"title": "lab14.py", "code": "import time\nimport csv\nimport adafruit_dht\nimport board\n\n# Setup DHT11 on GPIO21\ndht_device = adafruit_dht.DHT11(board.D21)\n\n# Create/open CSV file\nfilename = \"dht11_log.csv\"\n\n# Write header row\nwith open(filename, mode=\"w\", newline=\"\") as file:\n    writer = csv.writer(file)\n    writer.writerow([\"Time\", \"Temperature (\\u00B0C)\", \"Humidity (%)\"])\n\nprint(\"Logging DHT11 data to dht11_log.csv... Press Ctrl+C to stop.\")\n\ntry:\n    while True:\n        try:\n            temp_c = dht_device.temperature\n            humidity = dht_device.humidity\n            timestamp = time.strftime(\"%Y-%m-%d %H:%M:%S\")\n\n            if temp_c is not None and humidity is not None:\n                print(f\"{timestamp} | Temp: {temp_c:.1f} \\u00B0C | Humidity: {humidity:.1f}%\")\n\n                # Append to CSV\n                with open(filename, mode=\"a\", newline=\"\") as file:\n                    writer = csv.writer(file)\n                    writer.writerow([timestamp, f\"{temp_c:.1f}\", f\"{humidity:.1f}\"])\n            else:\n                print(\"Sensor failure. Check wiring.\")\n\n        except RuntimeError as err:\n            # Common with DHT sensors, just retry\n            print(f\"Error: {err.args[0]}\")\n\n        time.sleep(2.0)  # log every 2 seconds\n\nexcept KeyboardInterrupt:\n    print(\"\\nLogging stopped by user.\")"}, {"title": "Instructions / Setup", "code": "# install and use LibreOffice to view .csv file\nsudo apt update\nsudo apt install libreoffice\nlibreoffice dht11_log.csv\n\n# install and use csvkit to view .csv file\nsudo apt install csvkit\ncsvlook dht11_log.csv"}]}, {"number": 15, "blocks": [{"title": "Instructions / Setup", "code": "# install in the env environment\nsudo apt update\nsudo apt install sqlite3"}, {"title": "lab15.py", "code": "import time\nimport sqlite3\nimport adafruit_dht\nimport board\n\n# Setup DHT11 on GPIO21\ndht_device = adafruit_dht.DHT11(board.D21)\n\n# Connect (or create) SQLite database\nconn = sqlite3.connect(\"dht11_data.db\")\ncursor = conn.cursor()\n\n# Create table if not exists\ncursor.execute(\"\"\"\n    CREATE TABLE IF NOT EXISTS dht11_log (\n        id INTEGER PRIMARY KEY AUTOINCREMENT,\n        timestamp TEXT,\n        temperature REAL,\n        humidity REAL\n    )\n\"\"\")\nconn.commit()\n\nprint(\"Logging DHT11 data to SQLite (dht11_data.db)... Press Ctrl+C to stop.\")\n\ntry:\n    while True:\n        try:\n            temp_c = dht_device.temperature\n            humidity = dht_device.humidity\n            timestamp = time.strftime(\"%Y-%m-%d %H:%M:%S\")\n\n            if temp_c is not None and humidity is not None:\n                print(f\"{timestamp} | Temp: {temp_c:.1f} \\u00B0C | Humidity: {humidity:.1f}%\")\n\n                # Insert into SQLite\n                cursor.execute(\"INSERT INTO dht11_log (timestamp, temperature, humidity) VALUES (?, ?, ?)\",\n                               (timestamp, temp_c, humidity))\n                conn.commit()\n            else:\n                print(\"Sensor failure. Check wiring.\")\n\n        except RuntimeError as err:\n            print(f\"Error: {err.args[0]}\")\n\n        time.sleep(2.0)  # log every 2 seconds\n\nexcept KeyboardInterrupt:\n    print(\"\\nLogging stopped by user.\")\n    conn.close()"}, {"title": "Instructions / Setup", "code": "# sqlite commands\nsqlite3 dht11_data.db\nsqlite> .tables\nsqlite> SELECT * FROM dht11_log LIMIT 5;\n\n# Challenge: \n# Write a query to show all readings where temperature > 30°C.\nsqlite>  SELECT * FROM dht11_log WHERE temperature > 30;\n#exit\nsqlite> .exit"}]}, {"number": 16, "blocks": [{"title": "Instructions / Setup", "code": "# install in the env environment\npip3 install paho-mqtt"}, {"title": "lab16_publisher.py", "code": "import paho.mqtt.client as mqtt\nimport time\n\nBROKER = \"broker.hivemq.com\"\nPORT = 1883\nTOPIC = \"hostname/lab16/led\"\n\nclient = mqtt.Client(callback_api_version=mqtt.CallbackAPIVersion.VERSION2)\nclient.connect(BROKER, PORT, 60)\n\nprint(\"Publishing messages to HiveMQ... Press Ctrl+C to stop.\")\n\ntry:\n    while True:\n        msg = input(\"Type LED ON or LED OFF: \")\n        client.publish(TOPIC, msg)\n        print(f\"Sent: {msg}\")\n        time.sleep(1)\nexcept KeyboardInterrupt:\n    print(\"Publisher stopped\")"}, {"title": "lab16_subscriber.py", "code": "import paho.mqtt.client as mqtt\nfrom gpiozero import LED\n\nBROKER = \"broker.hivemq.com\"\nPORT = 1883\nTOPIC = \"hostname/lab16/led\"\n\nled = LED(17)\n\ndef on_message(client, userdata, msg):\n    message = msg.payload.decode()\n    print(f\"Received: {message}\")\n    if message.upper() == \"LED ON\":\n        led.on()\n    elif message.upper() == \"LED OFF\":\n        led.off()\n\nclient = mqtt.Client(callback_api_version=mqtt.CallbackAPIVersion.VERSION2)\nclient.on_message = on_message\n\nclient.connect(BROKER, PORT, 60)\nclient.subscribe(TOPIC)\n\nprint(\"Subscriber connected to HiveMQ. Waiting for messages...\")\nclient.loop_forever()"}]}, {"number": 17, "blocks": [{"title": "Instructions / Setup", "code": "# install in the env environment\nsudo apt update\npip3 install flask "}, {"title": "lab17_flask.py", "code": "import time\nimport threading\nfrom flask import Flask, jsonify\nimport adafruit_dht\nimport board\nfrom gpiozero import LED\n\n# GPIO setup\nDHT_PIN = board.D21\nLED_PIN = 17\n\ndht = adafruit_dht.DHT11(DHT_PIN)\nled = LED(LED_PIN)\n\nsensor_state = {\n    \"temperature_c\": None,\n    \"humidity\": None,\n    \"last_update\": None\n}\n\nsensor_lock = threading.Lock()\n\n# Sensor polling thread\ndef sensor_poll(interval=2.0):\n\n    while True:\n\n        try:\n            t = dht.temperature\n            h = dht.humidity\n\n            with sensor_lock:\n\n                if t is not None:\n                    sensor_state[\"temperature_c\"] = round(t, 1)\n\n                if h is not None:\n                    sensor_state[\"humidity\"] = round(h, 1)\n\n                sensor_state[\"last_update\"] = time.strftime(\"%Y-%m-%d %H:%M:%S\")\n\n        except RuntimeError as err:\n            print(\"DHT error:\", err)\n\n        except Exception as e:\n            print(\"Unexpected error:\", e)\n\n        time.sleep(interval)\n\n# Flask app\napp = Flask(__name__)\n\n@app.route('/')\ndef index():\n\n    with open(\"index.html\", \"r\") as file:\n        return file.read()\n\n@app.route('/status')\ndef status():\n\n    with sensor_lock:\n\n        data = {\n            \"temperature_c\": sensor_state[\"temperature_c\"],\n            \"humidity\": sensor_state[\"humidity\"],\n            \"last_update\": sensor_state[\"last_update\"],\n            \"led_on\": bool(led.is_lit)\n        }\n\n    return jsonify(data)\n\n@app.route('/led/on')\ndef led_on():\n\n    led.on()\n\n    return jsonify({\n        \"success\": True\n    })\n\n@app.route('/led/off')\ndef led_off():\n\n    led.off()\n\n    return jsonify({\n        \"success\": True\n    })\n\n# Main\nif __name__ == '__main__':\n\n    t = threading.Thread(target=sensor_poll, daemon=True)\n    t.start()\n\n    app.run(\n        host='0.0.0.0',\n        port=5000,\n        debug=False,\n        threaded=True\n    )"}, {"title": "index.html", "code": "<!doctype html>\n<html>\n<head>\n    <meta charset=\"utf-8\"/>\n    <title>Pi IoT Dashboard<\/title>\n\n    <style>\n        body {\n            font-family: Arial;\n            text-align: center;\n            margin: 30px;\n        }\n\n        .card {\n            display: inline-block;\n            padding: 20px;\n            border-radius: 8px;\n            box-shadow: 0 2px 6px rgba(0,0,0,.15);\n        }\n\n        .big {\n            font-size: 2.5rem;\n            margin: 10px;\n        }\n\n        button {\n            padding: 10px 20px;\n            font-size: 1rem;\n            margin: 6px;\n        }\n\n        .small {\n            font-size: 0.9rem;\n            color: #666;\n        }\n    <\/style>\n\n<\/head>\n\n<body>\n\n    <h1>Raspberry Pi IoT Dashboard<\/h1>\n\n    <div class=\"card\">\n\n        <div>Temperature<\/div>\n        <div id=\"temp\" class=\"big\">-- \\u00B0C<\/div>\n\n        <div>Humidity<\/div>\n        <div id=\"hum\" class=\"big\">-- %<\/div>\n\n        <div class=\"small\" id=\"updated\">\n            Last: --\n        <\/div>\n\n    <\/div>\n\n    <div class=\"card\" style=\"margin-left:12px;\">\n\n        <div>LED Control<\/div>\n\n        <div style=\"margin-top:12px;\">\n            <button onclick=\"ledOn()\">Turn LED ON<\/button>\n            <button onclick=\"ledOff()\">Turn LED OFF<\/button>\n        <\/div>\n\n        <div style=\"margin-top:12px;\">\n            State: <span id=\"ledstate\">--<\/span>\n        <\/div>\n    <\/div>\n<script>\n\nasync function fetchStatus() {\n\n    try {\n\n        const r = await fetch('/status');\n        const data = await r.json();\n\n        document.getElementById('temp').innerText =\n            (data.temperature_c !== null)\n            ? data.temperature_c + '\\u00B0C'\n            : '--';\n\n        document.getElementById('hum').innerText =\n            (data.humidity !== null)\n            ? data.humidity + ' %'\n            : '--';\n\n        document.getElementById('updated').innerText =\n            'Last: ' + (data.last_update || '--');\n\n        document.getElementById('ledstate').innerText =\n            data.led_on ? 'ON' : 'OFF';\n\n    } catch (e) {\n        console.error('Status fetch error', e);\n    }\n}\n\nasync function ledOn() {\n    await fetch('/led/on');\n    fetchStatus();\n}\n\nasync function ledOff() {\n    await fetch('/led/off');\n    fetchStatus();\n}\n\nfetchStatus();\nsetInterval(fetchStatus, 3000);\n\n<\/script>\n<\/body>\n<\/html>"}]}, {"number": 18, "blocks": [{"title": "Instructions / Setup", "code": "# install\npip3 install requests"}, {"title": "lab18.py", "code": "import time\nimport requests\nimport adafruit_dht\nimport board\n\n# Setup DHT11 on GPIO21\ndht_device = adafruit_dht.DHT11(board.D21)\n\n# ThingSpeak settings\nTHINGSPEAK_API_KEY = \"YOUR_WRITE_API_KEY\"  # replace with your API key\nTHINGSPEAK_URL = \"https://api.thingspeak.com/update\"\n\nprint(\"Sending DHT11 data to ThingSpeak... Press Ctrl+C to stop.\")\n\ntry:\n    while True:\n        try:\n            temp_c = dht_device.temperature\n            humidity = dht_device.humidity\n\n            if temp_c is not None and humidity is not None:\n                print(f\"Temp: {temp_c:.1f} \\u00B0C | Humidity: {humidity:.1f}%\")\n\n                # Send data to ThingSpeak\n                payload = {\n                    \"api_key\": THINGSPEAK_API_KEY,\n                    \"field1\": temp_c,\n                    \"field2\": humidity\n                }\n                response = requests.get(THINGSPEAK_URL, params=payload)\n\n                if response.status_code == 200:\n                    print(\"Data sent successfully!\")\n                else:\n                    print(\"Failed to send data. HTTP code:\", response.status_code)\n            else:\n                print(\"Sensor error: check wiring.\")\n\n        except RuntimeError as err:\n            print(\"Runtime Error:\", err.args[0])\n\n        time.sleep(15)  # ThingSpeak free accounts require 15s update interval\n\nexcept KeyboardInterrupt:\n    print(\"\\nStopped by user.\")"}]}, {"number": 19, "blocks": [{"title": "Instructions / Setup", "code": "sudo apt update\nsudo apt install python3-bluez -y\n\nsudo hciconfig"}, {"title": "lab19_bt_discover.py", "code": "import bluetooth\n\nprint(\"Looking for nearby Bluetooth devices...\")\nnearby_devices = bluetooth.discover_devices(duration=5, lookup_names=True)\n\nprint(\"Found %d devices\" % len(nearby_devices))\nfor addr, name in nearby_devices:\n    print(\" %s - %s\" % (addr, name))"}, {"title": "lab19_bt_presence.py", "code": "import bluetooth\nimport time\n\n# Replace with your device MAC address\ntarget_mac = \"14:1A:A3:98:9B:1C\"\n\nwhile True:\n    print(\"Checking at \" + time.strftime(\"%a, %d %b %Y %H:%M:%S\", time.gmtime()))\n    result = bluetooth.lookup_name(target_mac, timeout=10)\n\n    if result is not None:\n        print(\"Device is present (Mummy is in).\")\n    else:\n        print(\"Device not found (Mummy is out).\")\n\n    time.sleep(5)"}]}, {"number": 20, "blocks": [{"title": "Instructions / Setup", "code": "#1. Activate the Python Virtual Environment that was created in Lab 9:\nsource env/bin/activate\n\n#2. Install Mediapipe and opencv\npip3 install mediapipe opencv-python"}, {"title": "lab20_finger.py", "code": "import cv2\nimport time\nimport mediapipe as mp\n\n# MediaPipe Tasks API\nBaseOptions = mp.tasks.BaseOptions\nHandLandmarker = mp.tasks.vision.HandLandmarker\nHandLandmarkerOptions = mp.tasks.vision.HandLandmarkerOptions\nRunningMode = mp.tasks.vision.RunningMode\n\n# Drawing utilities\ndrawing = mp.tasks.vision.drawing_utils\nconnections = mp.tasks.vision.HandLandmarksConnections.HAND_CONNECTIONS\n\nMODEL_PATH = \"hand_landmarker.task\"\n\n# Configure hand detection\noptions = HandLandmarkerOptions(\n    base_options=BaseOptions(\n        model_asset_path=MODEL_PATH\n    ),\n    running_mode=RunningMode.VIDEO,\n    num_hands=2,\n    min_hand_detection_confidence=0.5,\n    min_hand_presence_confidence=0.5,\n    min_tracking_confidence=0.5\n)\n\ncap = cv2.VideoCapture(0)\n\ntry:\n    with HandLandmarker.create_from_options(options) as hands:\n        start_time = time.monotonic()\n        previous_timestamp_ms = -1\n\n        while cap.isOpened():\n            success, image = cap.read()\n\n            if not success:\n                print(\"Ignoring empty camera frame.\")\n                continue\n\n            image = cv2.flip(image, 1)\n            image_rgb = cv2.cvtColor(\n                image, cv2.COLOR_BGR2RGB\n            )\n\n            # Timestamp must increase for every video frame\n            timestamp_ms = int(\n                (time.monotonic() - start_time) * 1000\n            )\n            timestamp_ms = max(\n                timestamp_ms, previous_timestamp_ms + 1\n            )\n            previous_timestamp_ms = timestamp_ms\n\n            mp_image = mp.Image(\n                image_format=mp.ImageFormat.SRGB,\n                data=image_rgb\n            )\n\n            results = hands.detect_for_video(\n                mp_image, timestamp_ms\n            )\n\n            # Draw hand landmarks\n            for hand_landmarks in results.hand_landmarks:\n                drawing.draw_landmarks(\n                    image,\n                    hand_landmarks,\n                    connections\n                )\n\n            cv2.imshow(\"MediaPipe Hands\", image)\n\n            if cv2.waitKey(5) & 0xFF == 27:\n                break\n\nfinally:\n    cap.release()\n    cv2.destroyAllWindows()"}, {"title": "lab20_finger_count.py", "code": "import cv2\nimport time\nimport mediapipe as mp\n\n# --------------------------------------------------\n# Initialize MediaPipe Hand Landmarker (Tasks API)\n# --------------------------------------------------\n\nBaseOptions = mp.tasks.BaseOptions\nHandLandmarker = mp.tasks.vision.HandLandmarker\nHandLandmarkerOptions = mp.tasks.vision.HandLandmarkerOptions\nRunningMode = mp.tasks.vision.RunningMode\n\nmp_drawing = mp.tasks.vision.drawing_utils\nmp_connections = mp.tasks.vision.HandLandmarksConnections.HAND_CONNECTIONS\n\nMODEL_PATH = \"hand_landmarker.task\"\n\noptions = HandLandmarkerOptions(\n    base_options=BaseOptions(model_asset_path=MODEL_PATH),\n    running_mode=RunningMode.VIDEO,\n    num_hands=2,\n    min_hand_detection_confidence=0.5,\n    min_hand_presence_confidence=0.5,\n    min_tracking_confidence=0.5\n)\n\n# --------------------------------------------------\n# Open webcam\n# --------------------------------------------------\n\ncap = cv2.VideoCapture(0)\n\nif not cap.isOpened():\n    raise RuntimeError(\"Cannot open webcam. Check your camera connection.\")\n\nstart_time = time.monotonic()\nprevious_timestamp_ms = -1\n\ntry:\n    with HandLandmarker.create_from_options(options) as hands:\n\n        while cap.isOpened():\n            success, image = cap.read()\n\n            if not success:\n                print(\"Ignoring empty camera frame.\")\n                continue\n\n            # Flip for selfie-view display\n            image = cv2.flip(image, 1)\n\n            # Convert BGR to RGB\n            image_rgb = cv2.cvtColor(image, cv2.COLOR_BGR2RGB)\n\n            # Create MediaPipe image\n            mp_image = mp.Image(\n                image_format=mp.ImageFormat.SRGB,\n                data=image_rgb\n            )\n\n            # VIDEO mode requires increasing timestamps\n            timestamp_ms = int(\n                (time.monotonic() - start_time) * 1000\n            )\n            timestamp_ms = max(\n                timestamp_ms, previous_timestamp_ms + 1\n            )\n            previous_timestamp_ms = timestamp_ms\n\n            # Detect hands\n            results = hands.detect_for_video(\n                mp_image, timestamp_ms\n            )\n\n            # Display text even when no hand is detected\n            hand_count = len(results.hand_landmarks)\n\n            cv2.putText(\n                image, f\"Hands: {hand_count}\", (10, 30),\n                cv2.FONT_HERSHEY_SIMPLEX, 0.8, (0, 255, 255), 2\n            )\n\n            # Process each detected hand\n            for hand_index, landmarks in enumerate(\n                results.hand_landmarks\n            ):\n\n                # Draw landmarks and connections\n                mp_drawing.draw_landmarks(\n                    image, landmarks, mp_connections\n                )\n\n                # Finger tip indices:\n                # Thumb, index, middle, ring, pinky\n                tip_ids = [4, 8, 12, 16, 20]\n                fingers = []\n\n                # Thumb (works as a simple heuristic for\n                # the mirrored webcam image)\n                if landmarks[4].x < landmarks[3].x:\n                    fingers.append(1)\n                else:\n                    fingers.append(0)\n\n                # Index, middle, ring and pinky fingers\n                for finger_id in range(1, 5):\n                    if (\n                        landmarks[tip_ids[finger_id]].y\n                        < landmarks[tip_ids[finger_id] - 2].y\n                    ):\n                        fingers.append(1)\n                    else:\n                        fingers.append(0)\n\n                total_fingers = fingers.count(1)\n\n                # Gesture classification\n                if fingers == [0, 1, 0, 0, 0]:\n                    gesture = \"One up\"\n\n                elif fingers == [0, 1, 1, 0, 0]:\n                    gesture = \"Yay\"\n\n                elif fingers == [1, 0, 0, 0, 0]:\n                    gesture = \"Thumbs up\"\n\n                elif fingers == [1, 1, 1, 1, 1]:\n                    gesture = \"High five!\"\n\n                elif total_fingers == 0:\n                    gesture = \"Stop\"\n\n                else:\n                    gesture = \"\"\n\n                # Show results for each hand\n                y_offset = 70 + hand_index * 75\n\n                cv2.putText(\n                    image,\n                    f\"Hand {hand_index + 1}: Fingers {total_fingers}\",\n                    (10, y_offset),\n                    cv2.FONT_HERSHEY_SIMPLEX,\n                    0.65, (0, 255, 0), 2\n                )\n\n                cv2.putText(\n                    image,\n                    f\"Gesture: {gesture}\",\n                    (10, y_offset + 30),\n                    cv2.FONT_HERSHEY_SIMPLEX,\n                    0.65, (255, 0, 0), 2\n                )\n\n            # Display webcam output\n            cv2.imshow(\"Hand Tracking + Finger Count\", image)\n\n            # Press ESC to exit\n            if cv2.waitKey(5) & 0xFF == 27:\n                break\n\nfinally:\n    cap.release()\n    cv2.destroyAllWindows()"}, {"title": "lab20_face.py", "code": "###### lab20_face.py ######\n\n\nimport cv2\nimport time\nimport mediapipe as mp\n\n# --------------------------------------------------\n# Initialize MediaPipe Face Detector (Tasks API)\n# --------------------------------------------------\n\nBaseOptions = mp.tasks.BaseOptions\nFaceDetector = mp.tasks.vision.FaceDetector\nFaceDetectorOptions = mp.tasks.vision.FaceDetectorOptions\nRunningMode = mp.tasks.vision.RunningMode\n\nMODEL_PATH = \"face_detector.tflite\"\n\noptions = FaceDetectorOptions(\n    base_options=BaseOptions(\n        model_asset_path=MODEL_PATH\n    ),\n    running_mode=RunningMode.VIDEO,\n    min_detection_confidence=0.5\n)\n\n# --------------------------------------------------\n# Open webcam\n# --------------------------------------------------\n\ncap = cv2.VideoCapture(0)\n\nif not cap.isOpened():\n    raise RuntimeError(\n        \"Cannot open webcam. Check your camera connection.\"\n    )\n\nstart_time = time.monotonic()\nprevious_timestamp_ms = -1\n\ntry:\n    with FaceDetector.create_from_options(options) as detector:\n\n        while cap.isOpened():\n\n            success, image = cap.read()\n\n            if not success:\n                print(\"Ignoring empty camera frame.\")\n                continue\n\n            # Flip image horizontally for selfie view\n            image = cv2.flip(image, 1)\n\n            # Convert BGR to RGB\n            image_rgb = cv2.cvtColor(\n                image, cv2.COLOR_BGR2RGB\n            )\n\n            # Create MediaPipe image\n            mp_image = mp.Image(\n                image_format=mp.ImageFormat.SRGB,\n                data=image_rgb\n            )\n\n            # Generate increasing video timestamps\n            timestamp_ms = int(\n                (time.monotonic() - start_time) * 1000\n            )\n            timestamp_ms = max(\n                timestamp_ms, previous_timestamp_ms + 1\n            )\n            previous_timestamp_ms = timestamp_ms\n\n            # Detect faces\n            results = detector.detect_for_video(\n                mp_image, timestamp_ms\n            )\n\n            # Number of faces detected\n            face_count = len(results.detections)\n\n            cv2.putText(\n                image,\n                f\"Faces detected: {face_count}\",\n                (10, 35),\n                cv2.FONT_HERSHEY_SIMPLEX,\n                0.8,\n                (0, 255, 255),\n                2\n            )\n\n            # Draw a bounding box for each face\n            for index, detection in enumerate(\n                results.detections\n            ):\n\n                bbox = detection.bounding_box\n\n                x = bbox.origin_x\n                y = bbox.origin_y\n                w = bbox.width\n                h = bbox.height\n\n                # Keep coordinates inside the image\n                image_h, image_w = image.shape[:2]\n\n                x1 = max(0, x)\n                y1 = max(0, y)\n                x2 = min(image_w - 1, x + w)\n                y2 = min(image_h - 1, y + h)\n\n                # Draw face rectangle\n                cv2.rectangle(\n                    image,\n                    (x1, y1),\n                    (x2, y2),\n                    (0, 255, 0),\n                    2\n                )\n\n                # Get confidence score\n                confidence = (\n                    detection.categories[0].score\n                    if detection.categories\n                    else 0.0\n                )\n\n                # Display face number and confidence\n                label = (\n                    f\"Face {index + 1}: \"\n                    f\"{confidence:.2f}\"\n                )\n\n                text_y = max(20, y1 - 10)\n\n                cv2.putText(\n                    image,\n                    label,\n                    (x1, text_y),\n                    cv2.FONT_HERSHEY_SIMPLEX,\n                    0.6,\n                    (255, 0, 0),\n                    2\n                )\n\n            # Display webcam output\n            cv2.imshow(\n                \"MediaPipe Face Detection\",\n                image\n            )\n\n            # Press ESC to exit\n            if cv2.waitKey(5) & 0xFF == 27:\n                break\n\nfinally:\n    cap.release()\n    cv2.destroyAllWindows()"}, {"title": "Instructions / Setup", "code": "###### lab20_face_emotions ######\n\n\n#3. Install Deepface for emotions\npip3 install deepface tf-keras --no-deps\n\npython -m pip install flask gdown onnxruntime"}, {"title": "lab20_face_emotions.py", "code": "import cv2\nimport time\nimport mediapipe as mp\nfrom deepface import DeepFace\n\n# --------------------------------------------------\n# 1. Initialize MediaPipe Face Detector (Tasks API)\n# --------------------------------------------------\n\nBaseOptions = mp.tasks.BaseOptions\nFaceDetector = mp.tasks.vision.FaceDetector\nFaceDetectorOptions = mp.tasks.vision.FaceDetectorOptions\nRunningMode = mp.tasks.vision.RunningMode\n\nMODEL_PATH = \"face_detector.tflite\"\n\noptions = FaceDetectorOptions(\n    base_options=BaseOptions(\n        model_asset_path=MODEL_PATH\n    ),\n    running_mode=RunningMode.VIDEO,\n    min_detection_confidence=0.5\n)\n\n# --------------------------------------------------\n# 2. Open webcam\n# --------------------------------------------------\n\ncap = cv2.VideoCapture(0)\n\nif not cap.isOpened():\n    print(\"Error: Could not open camera.\")\n    raise SystemExit(1)\n\nstart_time = time.monotonic()\nprevious_timestamp_ms = -1\n\n# Cache the latest emotion results by face index\nlast_emotions = {}\n\ntry:\n    with FaceDetector.create_from_options(options) as detector:\n\n        while True:\n            success, frame = cap.read()\n\n            if not success:\n                print(\"Ignoring empty frame.\")\n                continue\n\n            # Mirror image for selfie view\n            frame = cv2.flip(frame, 1)\n\n            h, w = frame.shape[:2]\n\n            # --------------------------------------------------\n            # 3. Prepare image for MediaPipe\n            # --------------------------------------------------\n\n            frame_rgb = cv2.cvtColor(\n                frame, cv2.COLOR_BGR2RGB\n            )\n\n            mp_image = mp.Image(\n                image_format=mp.ImageFormat.SRGB,\n                data=frame_rgb\n            )\n\n            # VIDEO mode requires increasing timestamps\n            timestamp_ms = int(\n                (time.monotonic() - start_time) * 1000\n            )\n\n            timestamp_ms = max(\n                timestamp_ms, previous_timestamp_ms + 1\n            )\n\n            previous_timestamp_ms = timestamp_ms\n\n            # Detect faces\n            results = detector.detect_for_video(\n                mp_image, timestamp_ms\n            )\n\n            # Show total face count\n            face_count = len(results.detections)\n\n            cv2.putText(\n                frame,\n                f\"Faces detected: {face_count}\",\n                (10, 30),\n                cv2.FONT_HERSHEY_SIMPLEX,\n                0.7,\n                (0, 255, 255),\n                2\n            )\n\n            # --------------------------------------------------\n            # 4. Detect faces and analyze emotions\n            # --------------------------------------------------\n\n            current_emotions = {}\n\n            for index, detection in enumerate(results.detections):\n\n                bbox = detection.bounding_box\n\n                # Calculate face bounding box\n                x1 = max(0, bbox.origin_x)\n                y1 = max(0, bbox.origin_y)\n                x2 = min(w, bbox.origin_x + bbox.width)\n                y2 = min(h, bbox.origin_y + bbox.height)\n\n                if x2 <= x1 or y2 <= y1:\n                    continue\n\n                # Draw rectangle around face\n                cv2.rectangle(\n                    frame,\n                    (x1, y1),\n                    (x2, y2),\n                    (0, 255, 0),\n                    2\n                )\n\n                # Display face detection confidence\n                confidence = (\n                    detection.categories[0].score\n                    if detection.categories\n                    else 0.0\n                )\n\n                cv2.putText(\n                    frame,\n                    f\"Face {index + 1}: {confidence:.2f}\",\n                    (x1, max(20, y1 - 10)),\n                    cv2.FONT_HERSHEY_SIMPLEX,\n                    0.5,\n                    (255, 255, 0),\n                    2\n                )\n\n                # Crop the detected face\n                face_crop = frame[y1:y2, x1:x2].copy()\n\n                # --------------------------------------------------\n                # 5. Analyze emotion with DeepFace\n                # --------------------------------------------------\n\n                try:\n                    analysis = DeepFace.analyze(\n                        img_path=face_crop,\n                        actions=[\"emotion\"],\n                        enforce_detection=False,\n                        detector_backend=\"skip\",\n                        silent=True\n                    )\n\n                    # DeepFace may return a list\n                    if isinstance(analysis, list):\n                        if not analysis:\n                            continue\n                        analysis = analysis[0]\n\n                    emotions = analysis.get(\"emotion\", {})\n\n                    if emotions:\n                        current_emotions[index] = emotions\n\n                except Exception as e:\n                    print(\"DeepFace error:\", repr(e))\n\n                # Use the current result or the last valid result\n                emotions = current_emotions.get(\n                    index, last_emotions.get(index)\n                )\n\n                if emotions:\n                    # Find the highest-scoring emotion\n                    dominant_emotion = max(\n                        emotions, key=emotions.get\n                    )\n\n                    dominant_score = emotions[dominant_emotion]\n                    happy_score = emotions.get(\"happy\", 0.0)\n\n                    # Display dominant emotion above the face\n                    emotion_label = (\n                        f\"{dominant_emotion}: \"\n                        f\"{dominant_score:.1f}%\"\n                    )\n\n                    happy_label = f\"Happy: {happy_score:.1f}%\"\n\n                    cv2.putText(\n                        frame,\n                        emotion_label,\n                        (x1, max(20, y1 - 35)),\n                        cv2.FONT_HERSHEY_SIMPLEX,\n                        0.65,\n                        (0, 255, 0),\n                        2\n                    )\n\n                    # Display Happy score below the face\n                    cv2.putText(\n                        frame,\n                        happy_label,\n                        (x1, min(h - 10, y2 + 25)),\n                        cv2.FONT_HERSHEY_SIMPLEX,\n                        0.6,\n                        (0, 255, 255),\n                        2\n                    )\n\n                else:\n                    # No successful emotion result yet\n                    cv2.putText(\n                        frame,\n                        \"Analyzing emotion...\",\n                        (x1, min(h - 10, y2 + 25)),\n                        cv2.FONT_HERSHEY_SIMPLEX,\n                        0.55,\n                        (0, 165, 255),\n                        2\n                    )\n\n            # Save the latest results for the next frame\n            last_emotions = current_emotions\n\n            # --------------------------------------------------\n            # 6. Display webcam output\n            # --------------------------------------------------\n\n            cv2.imshow(\n                \"MediaPipe Face + Emotion\",\n                frame\n            )\n\n            # Press ESC to exit\n            if cv2.waitKey(5) & 0xFF == 27:\n                break\n\nfinally:\n    cap.release()\n\n    try:\n        cv2.destroyAllWindows()\n    except cv2.error:\n        pass"}]}]</script><script>
(()=>{'use strict';const labs=JSON.parse(document.querySelector('#labdata').textContent);let selected=1;let query='';const nav=document.querySelector('#nav'),sections=document.querySelector('#sections'),heading=document.querySelector('#heading'),count=document.querySelector('#count'),status=document.querySelector('#status'),search=document.querySelector('#search');
async function copy(s,button){let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(s);ok=true;}}catch(e){}if(!ok){const ta=document.createElement('textarea');ta.value=s;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(ta);ta.focus();ta.select();try{ok=document.execCommand('copy')}catch(e){}ta.remove();}status.textContent=ok?'Copied to clipboard.':'Automatic copying was blocked by your browser. Select the code and press Ctrl+C.';if(ok&&button){const old=button.textContent;button.textContent='✓ Copied';setTimeout(()=>{button.textContent=old},1600);}}
// Native download links avoid synthetic-click and Blob restrictions in local browsers.
function pythonDownloadURL(source){return 'data:text/plain;charset=utf-8,'+encodeURIComponent(source);}
function drawNav(){nav.replaceChildren();for(const lab of labs){const b=document.createElement('button');b.textContent='Lab '+lab.number;b.type='button';b.className=selected===lab.number&&!query?'active':'';b.addEventListener('click',()=>{selected=lab.number;query='';search.value='';render();window.scrollTo({top:0,behavior:'smooth'})});nav.append(b)}}
function render(){drawNav();sections.replaceChildren();const matched=query?labs.map(l=>({...l,blocks:l.blocks.filter(b=>(`Lab ${l.number} ${b.title} ${b.code}`).toLowerCase().includes(query))})).filter(l=>l.blocks.length):selected===0?labs:[labs.find(l=>l.number===selected)];heading.textContent=query?'Search results':selected===0?'All labs':'Lab '+selected;const total=matched.reduce((n,l)=>n+l.blocks.length,0);count.textContent=total+' snippet'+(total===1?'':'s')+(query?' matching your search':'');status.textContent='';if(!total){const p=document.createElement('p');p.className='empty';p.textContent='No matching snippets found.';sections.append(p);return;}for(const lab of matched){if(query||selected===0){const h=document.createElement('h2');h.textContent='Lab '+lab.number;sections.append(h);}for(const block of lab.blocks){const card=document.createElement('article');card.className=lab.number<=5?'card no-copy':'card';const head=document.createElement('div');head.className='cardhead';const title=document.createElement('h3');title.textContent=block.title;const button=document.createElement('button');button.className='primary';button.type='button';button.textContent='Copy code';button.setAttribute('aria-label','Copy '+block.title+' from Lab '+lab.number);button.addEventListener('click',()=>copy(block.code,button));const actions=document.createElement('div');actions.className='fileactions';if(lab.number>5)actions.append(button);if(lab.number>5 && block.title.toLowerCase().endsWith('.py')){const lines=block.code.split('\n');const download=document.createElement('a');download.className='download';download.textContent='↓ Download .py';download.href=pythonDownloadURL(block.code);download.download=block.title;download.setAttribute('aria-label','Download '+block.title+' from Lab '+lab.number);download.addEventListener('click',()=>{status.textContent='Requested '+block.title+'. Check your browser Downloads folder. If no file appears, open this HTML directly in Chrome or Edge (not inside a file preview).';});actions.append(download);}head.append(title);if(lab.number>5)head.append(actions);card.append(head);const isSetup=block.title==='Instructions / Setup'||block.title.startsWith('Terminal commands');if(isSetup){button.remove();const hint=document.createElement('p');hint.className='linehint';hint.textContent='Copy setup commands individually.';if(lab.number>5)card.append(hint);const list=document.createElement('div');list.className='linecommands';for(const line of block.code.split('\n')){if(!line.trim())continue;const row=document.createElement('div');row.className='commandrow';const value=document.createElement('code');if(lab.number===8 && line.includes('/home/pi/lcd/lab7_lcd_ipaddress.py')){const needle='pi';const pos=line.indexOf('/home/'+needle+'/');value.append(document.createTextNode(line.slice(0,pos+6)));const mark=document.createElement('span');mark.style.color='#ffe45c';mark.style.fontWeight='700';mark.textContent=needle;value.append(mark,document.createTextNode(line.slice(pos+6+needle.length)));}else{value.textContent=line;}const lineButton=document.createElement('button');lineButton.className='linecopy';lineButton.type='button';lineButton.textContent='Copy';lineButton.setAttribute('aria-label','Copy line: '+line);lineButton.addEventListener('click',()=>copy(line.replace(/^\s*sqlite>\s*/,''),lineButton));row.append(value);if(lab.number>5 && !line.trimStart().startsWith('#'))row.append(lineButton);else row.classList.add('commentrow');list.append(row);}card.append(list);}else{const pre=document.createElement('pre');pre.className='code';const code=document.createElement('code');if((lab.number===16 && (block.title==='lab16_publisher.py'||block.title==='lab16_subscriber.py'))||(lab.number===18 && block.title==='lab18.py')||(lab.number===19 && block.title==='lab19_bt_presence.py')){const needle=lab.number===18?'"YOUR_WRITE_API_KEY"':lab.number===19?'14:1A:A3:98:9B:1C':'"hostname/lab16/led"';const pieces=block.code.split(needle);for(let i=0;i<pieces.length;i++){code.append(document.createTextNode(pieces[i]));if(i<pieces.length-1){const mark=document.createElement('span');mark.style.color='#ffe45c';mark.style.fontWeight='700';mark.textContent=needle;code.append(mark);}}}else{code.textContent=block.code;}pre.append(code);card.append(pre);}sections.append(card);}}}
document.addEventListener('copy',e=>{const sel=window.getSelection();const node=sel&&sel.anchorNode;const element=node&&(node.nodeType===1?node:node.parentElement);if(element&&element.closest('.no-copy'))e.preventDefault();},true);document.addEventListener('contextmenu',e=>{if(e.target.closest('.no-copy'))e.preventDefault();});document.addEventListener('dragstart',e=>{if(e.target.closest('.no-copy'))e.preventDefault();});search.addEventListener('input',()=>{query=search.value.trim().toLowerCase();render()});document.querySelector('#showAll').addEventListener('click',()=>{search.value='';query='';selected=0;render()});render();})();
